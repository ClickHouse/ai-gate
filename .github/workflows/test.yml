name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      # Everything comes from uv.lock; --frozen fails if it is out of date.
      - run: uv sync --frozen
      # The action installs from requirements.txt, so it must match the lock.
      - run: uv export --frozen --no-dev --no-emit-project -o /tmp/req.txt && diff -I '^#' /tmp/req.txt requirements.txt
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy aigate --ignore-missing-imports
      # No gh on the runner: a test that calls GitHub fails instead of reaching it.
      - run: sudo mv "$(command -v gh)" /tmp/gh-disabled
      - run: uv run pytest -q
